pull_request_rules:
  - name: automatic merge for LGTM label and bot pull requests based on ci success
    conditions:
      - base=main
      - or:
        - label~=LGTM$
        - author=dependabot[bot]
        - author=transifex-integration[bot]
        - author=imgbot[bot]
      - check-success=continuous-integration/appveyor/pr
    actions:
      merge:
        method: squash
