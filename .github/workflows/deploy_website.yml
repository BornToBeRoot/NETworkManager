name: GitHub Pages

on:
  workflow_dispatch:
  release:
    # Rebuild so the download page picks up the newly published (pre-)release.
    types: [published]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy_website.yml'
      - 'Website/**'
  pull_request:
    paths:
      - '.github/workflows/deploy_website.yml'
      - 'Website/**'

jobs:
  build-website:
    name: "Build Website"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      # Cancel outdated PR builds, but never a build that is deployed.
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: Website/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build website
        run: yarn build
        env:
          # Used by scripts/fetch-release-data.mjs to raise the GitHub API rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload website
        uses: actions/upload-artifact@v7
        if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        with:
          name: website
          path: Website/build
          # Keep .well-known/ and .nojekyll (hidden files are skipped by default).
          include-hidden-files: true
          retention-days: 1

  # Separate job, so only the deployment gets write access (not the build with its npm dependencies).
  deploy-website:
    name: "Deploy Website"
    needs: build-website
    if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-deploy
    steps:
      - name: Download website
        uses: actions/download-artifact@v8
        with:
          name: website
          path: build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
