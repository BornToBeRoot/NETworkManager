version: 2
updates:
- package-ecosystem: "nuget"
  directory: "/Source"
  schedule:
    interval: weekly
  target-branch: main
  commit-message:
    prefix: "Dependency (dependabot/nuget):"
- package-ecosystem: "dotnet-sdk"
  directory: "/Source"
  ignore:
  - dependency-name: dotnet-sdk
    update-types:
    - "version-update:semver-major"
  schedule:
    interval: weekly
  target-branch: main
  commit-message:
    prefix: "Dependency (dependabot/dotnet-sdk):"
- package-ecosystem: "npm"
  directory: "/Website"
  schedule:
    interval: weekly
  target-branch: main
  commit-message:
    prefix: "Dependency (dependabot/npm):"
  groups:
    # react and react-dom must have the exact same version (otherwise the website build fails)
    react:
      patterns:
        - "react"
        - "react-dom"
    # All @docusaurus/* packages must have the same version (otherwise the website build fails)
    docusaurus:
      patterns:
        - "@docusaurus/*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  target-branch: main
  commit-message:
    prefix: "Dependency (dependabot/github-actions):"
